components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: mediahub_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 128
  headers:
    RequestID:
      description: Validated or generated request correlation identifier
      schema:
        type: string
        maxLength: 64
        pattern: "^[A-Za-z0-9._-]+$"
  responses:
    TaskCenterValidationError:
      description: Invalid request (validation_failed)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    TaskCenterAuthenticationRequired:
      description: Administrator session required (authentication_required)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    TaskCenterCSRFError:
      description: Invalid CSRF token (csrf_invalid)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    TaskCenterNotFound:
      description: Task, schedule or library not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    TaskCenterConflict:
      description: Task type unavailable or operation conflicts with current state (task_type_unavailable, task_state_conflict, conflict)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    TaskCenterUnavailable:
      description: Task center unavailable (service_unavailable)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    LibraryResult:
      description: Saved library configuration
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Library"}
    AuthError:
      description: Safe authentication error; validation_failed, invalid_credentials, authentication_required, csrf_invalid, setup_required or already_initialized as applicable
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Throttled:
      description: Authentication admission is temporarily throttled
      headers:
        Retry-After:
          description: Minimum seconds before another attempt
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SessionStarted:
      description: Session established; new CSRF token replaces the bootstrap token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthSession"
    Healthy:
      description: Healthy
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
    Unavailable:
      description: Database unavailable
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    TaskType:
      type: string
      enum: [scan, strm, sync, check, cleanup, scrape, upload]
    TaskStatus:
      type: string
      enum: [queued, running, paused, completed, failed, canceled]
    TaskOutcome:
      type: string
      enum: [success, partial_failure, failure]
    TaskSource:
      type: string
      enum: [manual, schedule, retry]
    TaskAction:
      type: string
      enum: [pause, resume, cancel, retry, retry_failed]
    SchedulePeriod:
      type: string
      enum: [daily, weekly, monthly, custom]
    FullSyncPreview:
      type: object
      additionalProperties: false
      required: [revision, scan_complete, scanned_videos, candidate_count, failed_count, samples, output]
      properties:
        revision: {type: integer, format: int64, minimum: 1}
        scan_complete: {type: boolean, description: Whether scanning reached the end of the requested scope. See failed_count for individual failures.}
        scanned_videos: {type: integer, format: int64, minimum: 0}
        candidate_count: {type: integer, format: int64, minimum: 0}
        failed_count: {type: integer, format: int64, minimum: 0, description: Count of invalid source entries and failed subdirectories.}
        samples:
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/FullSyncPreviewSample"}
        output: {$ref: "#/components/schemas/FullSyncOutputCheck"}
    FullSyncPreviewSample:
      type: object
      additionalProperties: false
      required: [source_path, relative_path]
      properties:
        source_path: {type: string}
        relative_path: {type: string}
    FullSyncOutputCheck:
      type: object
      additionalProperties: false
      required: [status, message]
      properties:
        status: {type: string, enum: [ready, will_create, missing, not_directory, permission_denied, unavailable]}
        message: {type: string}
    StrmFile:
      type: object
      additionalProperties: false
      required: [id, library_id, library_name, name, relative_path, source_file_id, source_path, generated_at, size_bytes]
      properties:
        id: {type: string}
        library_id: {type: string}
        library_name: {type: string, nullable: true}
        name: {type: string}
        relative_path: {type: string}
        source_file_id: {type: string}
        source_path: {type: string}
        generated_at: {type: string, format: date-time}
        size_bytes: {type: integer, format: int64, minimum: 0}
    StrmPage:
      type: object
      additionalProperties: false
      required: [items, total, page, limit]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/StrmFile"}}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer}
        limit: {type: integer}
    StrmDetail:
      allOf:
        - {$ref: "#/components/schemas/StrmFile"}
        - type: object
          required: [output_path, file_state, content]
          properties:
            output_path: {type: string}
            file_state: {type: string, enum: [present, missing, modified, unavailable]}
            content: {type: string, nullable: true}
    TaskTypeCapability:
      type: object
      additionalProperties: false
      required: [type, available, reason, can_pause, can_retry_failed, can_schedule]
      properties:
        type: {$ref: "#/components/schemas/TaskType"}
        available: {type: boolean}
        reason: {type: string, nullable: true}
        can_pause: {type: boolean}
        can_retry_failed: {type: boolean}
        can_schedule: {type: boolean}
    TaskTypeCapabilities:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/TaskTypeCapability"}}
    SubmitTaskInput:
      type: object
      additionalProperties: false
      required: [type, library_id]
      properties:
        type: {$ref: "#/components/schemas/TaskType"}
        library_id: {type: string, minLength: 1, maxLength: 128}
    TaskActionInput:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: {$ref: "#/components/schemas/TaskAction"}
    Task:
      type: object
      additionalProperties: false
      required: [id, type, library_id, library_name, source, schedule_id, parent_id, status, outcome, created_at, started_at, finished_at, duration_ms, progress_percent, speed_bytes_per_second, current_file, total_items, succeeded_items, failed_items, skipped_items, actions]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        type: {$ref: "#/components/schemas/TaskType"}
        library_id: {type: string, minLength: 1, maxLength: 128}
        library_name: {type: string}
        source: {$ref: "#/components/schemas/TaskSource"}
        schedule_id: {type: string, nullable: true}
        parent_id: {type: string, nullable: true}
        status: {$ref: "#/components/schemas/TaskStatus"}
        outcome: {nullable: true, allOf: [{$ref: "#/components/schemas/TaskOutcome"}]}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        duration_ms: {type: integer, format: int64, minimum: 0, nullable: true}
        progress_percent: {type: number, format: double, minimum: 0, maximum: 100, nullable: true}
        speed_bytes_per_second: {type: integer, format: int64, minimum: 0, nullable: true}
        current_file: {type: string, nullable: true}
        total_items: {type: integer, format: int64, minimum: 0, nullable: true}
        succeeded_items: {type: integer, format: int64, minimum: 0}
        failed_items: {type: integer, format: int64, minimum: 0}
        skipped_items: {type: integer, format: int64, minimum: 0}
        actions: {type: array, items: {$ref: "#/components/schemas/TaskAction"}}
    TaskPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, total, by_type, by_status]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Task"}}
        next_cursor: {type: string, nullable: true}
        total: {type: integer, format: int64, minimum: 0}
        by_type: {type: object, additionalProperties: {type: integer, format: int64, minimum: 0}}
        by_status: {type: object, additionalProperties: {type: integer, format: int64, minimum: 0}}
    TaskFailure:
      type: object
      additionalProperties: false
      required: [id, path, reason]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        path: {type: string}
        reason: {type: string}
    TaskFailurePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/TaskFailure"}}
        next_cursor: {type: string, nullable: true}
    TaskLog:
      type: object
      additionalProperties: false
      required: [id, level, message, created_at]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        level: {type: string}
        message: {type: string}
        created_at: {type: string, format: date-time}
    TaskLogPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/TaskLog"}}
        next_cursor: {type: string, nullable: true}
    TaskEvent:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        notification: {$ref: "#/components/schemas/TaskOutcome"}
    ScheduleInput:
      type: object
      description: Daily uses time. Weekly uses time and weekdays (0 is Sunday). Monthly uses time and month_day. Custom uses a five-field Cron expression and the plan timezone.
      additionalProperties: false
      required: [name, type, library_id, enabled, period, timezone, notify_on]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        type: {$ref: "#/components/schemas/TaskType"}
        library_id: {type: string, nullable: true, minLength: 1, maxLength: 128, description: Null targets all eligible libraries.}
        enabled: {type: boolean}
        period: {$ref: "#/components/schemas/SchedulePeriod"}
        timezone: {type: string, minLength: 1, maxLength: 128, default: Asia/Shanghai}
        time: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        weekdays: {type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: {type: integer, minimum: 0, maximum: 6}}
        month_day: {type: integer, minimum: 1, maximum: 31}
        cron: {type: string, minLength: 1, maxLength: 160}
        notify_on: {type: array, maxItems: 3, uniqueItems: true, items: {$ref: "#/components/schemas/TaskOutcome"}}
    Schedule:
      type: object
      additionalProperties: false
      required: [id, name, type, library_id, enabled, period, timezone, notify_on, next_run_at, created_at, updated_at, revision]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        name: {type: string, minLength: 1, maxLength: 100}
        type: {$ref: "#/components/schemas/TaskType"}
        library_id: {type: string, nullable: true, minLength: 1, maxLength: 128, description: Null targets all eligible libraries.}
        enabled: {type: boolean}
        period: {$ref: "#/components/schemas/SchedulePeriod"}
        timezone: {type: string, minLength: 1, maxLength: 128, default: Asia/Shanghai}
        time: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        weekdays: {type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: {type: integer, minimum: 0, maximum: 6}}
        month_day: {type: integer, minimum: 1, maximum: 31}
        cron: {type: string, minLength: 1, maxLength: 160}
        notify_on: {type: array, maxItems: 3, uniqueItems: true, items: {$ref: "#/components/schemas/TaskOutcome"}}
        next_run_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        revision: {type: integer, format: int64, minimum: 1}
    ScheduleEnabledInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}
    SchedulePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Schedule"}}
        next_cursor: {type: string, nullable: true}
    LibraryConfig:
      type: object
      additionalProperties: false
      required: [name, directory_id, directory_path, media_type, output_path, generate_strm, strm_existing_file_policy, generate_nfo, generate_poster_cover, language_preference, scrape_source, exclude_directory_path, include_subdirectories, follow_directory_changes, file_encoding, link_type, strm_direct_domain, strm_link_format]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        directory_id: {type: string, pattern: '^[0-9]{1,32}$'}
        directory_path: {type: string, minLength: 1, maxLength: 1024}
        media_type: {type: string, enum: [movie, tv, anime, documentary, mixed]}
        output_path: {type: string, minLength: 1, maxLength: 1024, description: Absolute local path}
        generate_strm: {type: boolean}
        strm_existing_file_policy: {type: string, enum: [skip, overwrite], description: Preference for an existing STRM at the target output path; no file operations are executed.}
        generate_nfo: {type: boolean}
        generate_poster_cover: {type: boolean}
        language_preference: {type: string, enum: [zh-CN]}
        scrape_source: {type: string, enum: [tmdb, metatube, none]}
        exclude_directory_path: {type: string, maxLength: 1024}
        include_subdirectories: {type: boolean}
        follow_directory_changes: {type: boolean}
        file_encoding: {type: string, enum: [UTF-8]}
        link_type: {type: string, enum: [direct, proxy]}
        strm_direct_domain: {type: string, maxLength: 253, description: Shared STRM playback address. Accepts an HTTP(S) origin or a hostname/IP with optional port (defaults to HTTPS). May be empty until STRM generation is needed.}
        strm_link_format: {type: string, enum: [original_name, file_id]}
    Library:
      type: object
      additionalProperties: false
      required: [name, directory_id, directory_path, media_type, enabled, output_path, generate_strm, strm_existing_file_policy, generate_nfo, generate_poster_cover, language_preference, scrape_source, exclude_directory_path, include_subdirectories, follow_directory_changes, file_encoding, link_type, strm_direct_domain, strm_link_format, id, created_at, updated_at, revision]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        directory_id: {type: string, pattern: '^[0-9]{1,32}$'}
        directory_path: {type: string, minLength: 1, maxLength: 1024}
        media_type: {type: string, enum: [movie, tv, anime, documentary, mixed]}
        enabled: {type: boolean}
        output_path: {type: string, minLength: 1, maxLength: 1024, description: Absolute local path}
        generate_strm: {type: boolean}
        strm_existing_file_policy: {type: string, enum: [skip, overwrite], description: Preference for an existing STRM at the target output path; no file operations are executed.}
        generate_nfo: {type: boolean}
        generate_poster_cover: {type: boolean}
        language_preference: {type: string, enum: [zh-CN]}
        scrape_source: {type: string, enum: [tmdb, metatube, none]}
        exclude_directory_path: {type: string, maxLength: 1024}
        include_subdirectories: {type: boolean}
        follow_directory_changes: {type: boolean}
        file_encoding: {type: string, enum: [UTF-8]}
        link_type: {type: string, enum: [direct, proxy]}
        strm_direct_domain: {type: string, maxLength: 253, description: Saved STRM playback address shared by both link modes.}
        strm_link_format: {type: string, enum: [original_name, file_id]}
        id: {type: string}
        revision: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    LibraryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Library"}}
        next_cursor: {type: string, nullable: true}
    CloudDrivePage:
      type: object
      required: [directory_id, path, items, next_cursor, total, page, page_size, total_pages]
      properties:
        directory_id: {type: string}
        page: {type: integer, format: int64, minimum: 1, nullable: true, description: Null for a legacy cursor not aligned to a page boundary.}
        page_size: {type: integer, minimum: 1, maximum: 200}
        total_pages: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991, description: At least one even for an empty directory; may change between requests.}
        total:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Provider count for the current request at response time; may change between pages. Filter semantics are not yet verified against a live provider.
        path:
          type: array
          items: {$ref: "#/components/schemas/CloudDrivePath"}
        items:
          type: array
          items: {$ref: "#/components/schemas/CloudDriveItem"}
        next_cursor: {type: string, nullable: true}
    CloudDrivePath:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    CloudDriveItem:
      type: object
      required: [id, name, is_directory, size_bytes, modified_at, file_type]
      properties:
        id: {type: string}
        name: {type: string}
        is_directory: {type: boolean}
        size_bytes: {type: string, nullable: true}
        modified_at: {type: string, format: date-time, nullable: true}
        file_type: {type: string}
    SecuritySettings:
      type: object
      required: [username, session_lifetime_days]
      properties:
        username: { type: string }
        session_lifetime_days: { type: integer, enum: [1, 7, 30] }
    SecurityCredentialsRequest:
      type: object
      additionalProperties: false
      required: [username, current_password, new_password]
      properties:
        username: { type: string }
        current_password: { type: string }
        new_password:
          { type: string, description: Empty preserves the existing password. }
    SecuritySessionRequest:
      type: object
      additionalProperties: false
      required: [session_lifetime_days]
      properties:
        session_lifetime_days: { type: integer, enum: [1, 7, 30] }
    Provider115Account:
      type: object
      required: [connected, account_name, connected_at]
      properties:
        connected: { type: boolean }
        account_name: { type: string, nullable: true }
        connected_at: { type: string, format: date-time, nullable: true }
    Provider115Details:
      type: object
      required: [status, profile, space, space_status, devices, devices_status]
      properties:
        status: { type: string, enum: [unconfigured, valid, invalid] }
        profile:
          allOf:
            - $ref: "#/components/schemas/Provider115Profile"
          nullable: true
        space:
          allOf:
            - $ref: "#/components/schemas/Provider115Space"
          nullable: true
        space_status: { type: string, enum: [available, unavailable] }
        devices:
          type: array
          items: { $ref: "#/components/schemas/Provider115Device" }
        devices_status: { type: string, enum: [available, unavailable] }
    Provider115Profile:
      type: object
      required:
        [
          user_name,
          user_id,
          avatar,
          is_member,
          member_expires_at,
          member_forever,
        ]
      properties:
        user_name: { type: string }
        user_id:
          {
            type: string,
            nullable: true,
            description: Provider user ID represented as a string.,
          }
        avatar: { type: string, nullable: true }
        is_member:
          {
            type: boolean,
            nullable: true,
            description: Known Cookie nav VIP values mapped to membership only; unknown values remain null.,
          }
        member_expires_at:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: Membership expiry; null when unknown or no expiry is provided.,
          }
        member_forever:
          {
            type: boolean,
            nullable: true,
            description: Whether the provider marks membership as permanent.,
          }
    Provider115Space:
      type: object
      required: [used_bytes, total_bytes]
      properties:
        used_bytes:
          {
            type: string,
            description: Decimal byte count truncated towards zero.,
          }
        total_bytes:
          {
            type: string,
            description: Decimal byte count truncated towards zero.,
          }
    Provider115Device:
      type: object
      required: [name, type, ip, city, login_at, is_current]
      properties:
        name: { type: string }
        type: { type: string }
        ip: { type: string }
        city: { type: string }
        login_at: { type: string, format: date-time, nullable: true }
        is_current: { type: boolean }
    Provider115QR:
      type: object
      required: [id, qr_url, status, expires_at]
      properties:
        id: { type: string }
        qr_url: { type: string, description: PNG data URI }
        status:
          {
            type: string,
            enum: [waiting, scanned, succeeded, expired, canceled],
          }
        expires_at: { type: string, format: date-time }

    Administrator:
      type: object
      additionalProperties: false
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string
    AuthSession:
      type: object
      additionalProperties: false
      required: [administrator, expires_at, csrf_token]
      properties:
        administrator:
          $ref: "#/components/schemas/Administrator"
        expires_at:
          type: string
          format: date-time
        csrf_token:
          type: string
    AuthBootstrap:
      type: object
      additionalProperties: false
      required:
        [initialized, authenticated, administrator, expires_at, csrf_token]
      properties:
        initialized:
          type: boolean
        authenticated:
          type: boolean
        administrator:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Administrator"
        expires_at:
          type: string
          format: date-time
          nullable: true
        csrf_token:
          type: string
    InitializeRequest:
      type: object
      additionalProperties: false
      required:
        [
          username,
          password,
          service_url,
          output_directory,
          session_lifetime_days,
        ]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9_.-]+$"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 32
          pattern: '^[!-~]{8,32}(?![\s\S])'
          description: 8–32 printable non-space ASCII characters (U+0021–U+007E); letters, digits and ASCII symbols; no required mixture
        service_url:
          type: string
          description: Absolute HTTP(S) origin without credentials, query, fragment or path prefix
        output_directory:
          type: string
          default: /app/media
          description: Normalized absolute server filesystem path; syntax validation does not guarantee write access
        session_lifetime_days:
          type: integer
          enum: [1, 7, 30]
          default: 7
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password, remember_login]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9_.-]+$"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 32
          pattern: '^[!-~]{8,32}(?![\s\S])'
          description: 8–32 printable non-space ASCII characters (U+0021–U+007E); letters, digits and ASCII symbols; no required mixture
        remember_login:
          type: boolean
    SystemStatus:
      type: object
      additionalProperties: false
      required: [uptime_seconds, version]
      properties:
        uptime_seconds:
          type: integer
          format: int64
          minimum: 0
        version:
          type: string
          minLength: 1
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/APIError"
    APIError:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          enum:
            [
              provider_not_configured,
              provider_auth_invalid,
              provider_directory_not_found,
              full_sync_preview_timeout,
              full_sync_unavailable,
              service_unavailable,
              not_found,
              method_not_allowed,
              internal_error,
              conflict,
              validation_failed,
              invalid_credentials,
              authentication_required,
              csrf_invalid,
              setup_required,
              already_initialized,
              task_type_unavailable,
              task_state_conflict,
              rate_limited,
            ]
        message:
          type: string
        request_id:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
          description: Optional safe field validation messages keyed by request property name

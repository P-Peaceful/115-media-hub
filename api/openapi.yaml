openapi: 3.0.3
info:
  title: 115 Media Hub API
  version: 0.1.0
paths:
  /api/v1/libraries:
    get:
      operationId: listLibraries
      summary: List library configurations ordered by ID
      security: [{adminSession: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200":
          description: Library page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LibraryPage"}
        "400": {$ref: "#/components/responses/AuthError"}
        "401": {$ref: "#/components/responses/AuthError"}
        "503": {$ref: "#/components/responses/Unavailable"}
    post:
      operationId: createLibrary
      summary: Create a library configuration
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LibraryConfig"}
      responses:
        "201": {$ref: "#/components/responses/LibraryResult"}
        "400": {$ref: "#/components/responses/AuthError"}
        "401": {$ref: "#/components/responses/AuthError"}
        "403": {$ref: "#/components/responses/AuthError"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/libraries/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getLibrary
      security: [{adminSession: []}]
      responses:
        "200": {$ref: "#/components/responses/LibraryResult"}
        "401": {$ref: "#/components/responses/AuthError"}
        "404": {$ref: "#/components/responses/AuthError"}
        "503": {$ref: "#/components/responses/Unavailable"}
    put:
      operationId: updateLibrary
      description: Supply the revision read with the edited configuration. A stale revision returns 409.
      security: [{adminSession: []}]
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
        - name: X-Library-Revision
          in: header
          required: true
          description: Decimal revision from the library being edited.
          schema: {type: string, pattern: '^[1-9][0-9]*$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LibraryConfig"}
      responses:
        "200": {$ref: "#/components/responses/LibraryResult"}
        "400": {$ref: "#/components/responses/AuthError"}
        "401": {$ref: "#/components/responses/AuthError"}
        "403": {$ref: "#/components/responses/AuthError"}
        "404": {$ref: "#/components/responses/AuthError"}
        "409": {$ref: "#/components/responses/AuthError"}
        "503": {$ref: "#/components/responses/Unavailable"}
    delete:
      operationId: deleteLibrary
      summary: Delete configuration only; never delete files
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/AuthError"}
        "403": {$ref: "#/components/responses/AuthError"}
        "404": {$ref: "#/components/responses/AuthError"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/libraries/{id}/enabled:
    patch:
      operationId: setLibraryEnabled
      security: [{adminSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        "200": {$ref: "#/components/responses/LibraryResult"}
        "400": {$ref: "#/components/responses/AuthError"}
        "401": {$ref: "#/components/responses/AuthError"}
        "403": {$ref: "#/components/responses/AuthError"}
        "404": {$ref: "#/components/responses/AuthError"}
        "409": {$ref: "#/components/responses/AuthError"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /health/live:
    get:
      operationId: getLiveness
      summary: Check that the HTTP process is alive
      responses:
        "200":
          $ref: "#/components/responses/Healthy"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check database readiness
      responses:
        "200":
          $ref: "#/components/responses/Healthy"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      summary: Get running process information
      description: Requires an administrator session. Uptime is elapsed process lifetime in whole seconds; version is the build version or dev for unversioned builds. No-store response.
      security:
        - adminSession: []
      responses:
        "200":
          description: Process information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          $ref: "#/components/responses/AuthError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/auth/bootstrap:
    get:
      operationId: getAuthBootstrap
      summary: Obtain authentication state and an in-memory CSRF token
      description: Establishes a short-lived HttpOnly pre-auth cookie if unauthenticated. All responses use Cache-Control no-store. No anonymous identity or settings are exposed.
      responses:
        "200":
          description: Authentication state; authenticated session cookie is never returned in JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthBootstrap"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/auth/initialize:
    post:
      operationId: initializeAdministrator
      summary: Atomically initialize one administrator and settings and start a session
      description: Requires bootstrap cookie plus X-CSRF-Token. Maximum JSON body 4096 bytes. Sets a persistent HttpOnly SameSite=Lax session cookie; Secure on configured HTTPS deployments or direct TLS. Rotates any previous session. No-store responses.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializeRequest"
      responses:
        "201":
          $ref: "#/components/responses/SessionStarted"
        "400":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "409":
          $ref: "#/components/responses/AuthError"
        "429":
          $ref: "#/components/responses/Throttled"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/auth/login:
    post:
      operationId: loginAdministrator
      summary: Verify credentials and rotate the authenticated session
      description: Requires bootstrap cookie plus X-CSRF-Token. Maximum JSON body 4096 bytes. Remember-login sets cookie Max-Age and Expires; false omits both. Server fixed expiry always applies. No-store responses.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SessionStarted"
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "409":
          $ref: "#/components/responses/AuthError"
        "429":
          $ref: "#/components/responses/Throttled"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/auth/logout:
    post:
      operationId: logoutAdministrator
      summary: Revoke the current session and expire its cookie
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Session revoked; cookie expired; no-store response
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/settings/security:
    get:
      operationId: getSecuritySettings
      summary: getSecuritySettings
      security:
        - adminSession: []
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySettings"
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "404":
          $ref: "#/components/responses/AuthError"
        "503":
          $ref: "#/components/responses/AuthError"
  /api/v1/settings/security/credentials:
    put:
      operationId: updateSecurityCredentials
      summary: updateSecurityCredentials
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityCredentialsRequest"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySettings"
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "404":
          $ref: "#/components/responses/AuthError"
        "503":
          $ref: "#/components/responses/AuthError"
  /api/v1/settings/security/session:
    put:
      operationId: updateSecuritySession
      summary: updateSecuritySession
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecuritySessionRequest"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySettings"
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "404":
          $ref: "#/components/responses/AuthError"
        "503":
          $ref: "#/components/responses/AuthError"
  /api/v1/cloud-drive/files:
    get:
      operationId: listCloudDriveFiles
      summary: Browse a 115 directory
      description: Read-only provider listing. Offset-based pages may shift if the directory changes; refresh to restart. Search is not supported.
      security:
        - adminSession: []
      parameters:
        - name: directory_id
          in: query
          schema: {type: string, default: "0", pattern: '^[0-9]{1,32}$'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: cursor
          in: query
          description: Legacy opaque cursor; mutually exclusive with page.
          schema: {type: string, maxLength: 512}
        - name: page
          in: query
          description: One-based page; mutually exclusive with cursor. Page offset must not exceed JavaScript safe integer range.
          schema: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
        - name: sort
          in: query
          schema: {type: string, enum: [name, size, modified_at], default: name}
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc], default: asc}
        - name: type
          in: query
          schema: {type: string, enum: [all, video, audio, image, document], default: all}
      responses:
        "200":
          description: Directory page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CloudDrivePage"}
        "400": {$ref: "#/components/responses/AuthError"}
        "401": {$ref: "#/components/responses/AuthError"}
        "404": {$ref: "#/components/responses/AuthError"}
        "409": {$ref: "#/components/responses/AuthError"}
        "503": {$ref: "#/components/responses/AuthError"}
  /api/v1/settings/115:
    get:
      operationId: get115Account
      summary: get115Account
      security:
        - adminSession: []
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider115Account"
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "404":
          $ref: "#/components/responses/AuthError"
        "503":
          $ref: "#/components/responses/AuthError"
    delete:
      operationId: delete115Account
      summary: delete115Account
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Successful operation
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "404":
          $ref: "#/components/responses/AuthError"
        "503":
          $ref: "#/components/responses/AuthError"
  /api/v1/settings/115/details:
    get:
      operationId: get115AccountDetails
      summary: Get current 115 profile and space information
      description: Live provider data. Provider authorization rejection is reported as invalid; space may be unavailable independently. Credentials are never returned.
      security:
        - adminSession: []
      responses:
        "200":
          description: Current account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider115Details"
        "401":
          $ref: "#/components/responses/AuthError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/settings/115/qr:
    post:
      operationId: start115QR
      summary: start115QR
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider115QR"
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "404":
          $ref: "#/components/responses/AuthError"
        "503":
          $ref: "#/components/responses/AuthError"
  /api/v1/settings/115/qr/{id}/poll:
    post:
      operationId: poll115QR
      summary: poll115QR
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider115QR"
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "404":
          $ref: "#/components/responses/AuthError"
        "503":
          $ref: "#/components/responses/AuthError"
  /api/v1/settings/115/qr/{id}:
    delete:
      operationId: cancel115QR
      summary: cancel115QR
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Successful operation
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "404":
          $ref: "#/components/responses/AuthError"
        "503":
          $ref: "#/components/responses/AuthError"

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: mediahub_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 128
  headers:
    RequestID:
      description: Validated or generated request correlation identifier
      schema:
        type: string
        maxLength: 64
        pattern: "^[A-Za-z0-9._-]+$"
  responses:
    LibraryResult:
      description: Saved library configuration
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Library"}
    AuthError:
      description: Safe authentication error; validation_failed, invalid_credentials, authentication_required, csrf_invalid, setup_required or already_initialized as applicable
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Throttled:
      description: Authentication admission is temporarily throttled
      headers:
        Retry-After:
          description: Minimum seconds before another attempt
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SessionStarted:
      description: Session established; new CSRF token replaces the bootstrap token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthSession"
    Healthy:
      description: Healthy
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
    Unavailable:
      description: Database unavailable
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    LibraryConfig:
      type: object
      additionalProperties: false
      required: [name, directory_id, directory_path, media_type, output_path, generate_strm, strm_existing_file_policy, generate_nfo, generate_poster_cover, language_preference, scrape_source, exclude_directory_path, include_subdirectories, follow_directory_changes, file_encoding, link_type, strm_direct_domain, strm_link_format]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        directory_id: {type: string, pattern: '^[0-9]{1,32}$'}
        directory_path: {type: string, minLength: 1, maxLength: 1024}
        media_type: {type: string, enum: [movie, tv, anime, documentary, mixed]}
        output_path: {type: string, minLength: 1, maxLength: 1024, description: Absolute local path}
        generate_strm: {type: boolean}
        strm_existing_file_policy: {type: string, enum: [skip, overwrite], description: Preference for an existing STRM at the target output path; no file operations are executed.}
        generate_nfo: {type: boolean}
        generate_poster_cover: {type: boolean}
        language_preference: {type: string, enum: [zh-CN]}
        scrape_source: {type: string, enum: [tmdb, metatube, none]}
        exclude_directory_path: {type: string, maxLength: 1024}
        include_subdirectories: {type: boolean}
        follow_directory_changes: {type: boolean}
        file_encoding: {type: string, enum: [UTF-8]}
        link_type: {type: string, enum: [direct, proxy]}
        strm_direct_domain: {type: string, maxLength: 253}
        strm_link_format: {type: string, enum: [original_name, file_id]}
    Library:
      type: object
      additionalProperties: false
      required: [name, directory_id, directory_path, media_type, enabled, output_path, generate_strm, strm_existing_file_policy, generate_nfo, generate_poster_cover, language_preference, scrape_source, exclude_directory_path, include_subdirectories, follow_directory_changes, file_encoding, link_type, strm_direct_domain, strm_link_format, id, created_at, updated_at, revision]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        directory_id: {type: string, pattern: '^[0-9]{1,32}$'}
        directory_path: {type: string, minLength: 1, maxLength: 1024}
        media_type: {type: string, enum: [movie, tv, anime, documentary, mixed]}
        enabled: {type: boolean}
        output_path: {type: string, minLength: 1, maxLength: 1024, description: Absolute local path}
        generate_strm: {type: boolean}
        strm_existing_file_policy: {type: string, enum: [skip, overwrite], description: Preference for an existing STRM at the target output path; no file operations are executed.}
        generate_nfo: {type: boolean}
        generate_poster_cover: {type: boolean}
        language_preference: {type: string, enum: [zh-CN]}
        scrape_source: {type: string, enum: [tmdb, metatube, none]}
        exclude_directory_path: {type: string, maxLength: 1024}
        include_subdirectories: {type: boolean}
        follow_directory_changes: {type: boolean}
        file_encoding: {type: string, enum: [UTF-8]}
        link_type: {type: string, enum: [direct, proxy]}
        strm_direct_domain: {type: string, maxLength: 253}
        strm_link_format: {type: string, enum: [original_name, file_id]}
        id: {type: string}
        revision: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    LibraryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Library"}}
        next_cursor: {type: string, nullable: true}
    CloudDrivePage:
      type: object
      required: [directory_id, path, items, next_cursor, total, page, page_size, total_pages]
      properties:
        directory_id: {type: string}
        page: {type: integer, format: int64, minimum: 1, nullable: true, description: Null for a legacy cursor not aligned to a page boundary.}
        page_size: {type: integer, minimum: 1, maximum: 200}
        total_pages: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991, description: At least one even for an empty directory; may change between requests.}
        total:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Provider count for the current request at response time; may change between pages. Filter semantics are not yet verified against a live provider.
        path:
          type: array
          items: {$ref: "#/components/schemas/CloudDrivePath"}
        items:
          type: array
          items: {$ref: "#/components/schemas/CloudDriveItem"}
        next_cursor: {type: string, nullable: true}
    CloudDrivePath:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    CloudDriveItem:
      type: object
      required: [id, name, is_directory, size_bytes, modified_at, file_type]
      properties:
        id: {type: string}
        name: {type: string}
        is_directory: {type: boolean}
        size_bytes: {type: string, nullable: true}
        modified_at: {type: string, format: date-time, nullable: true}
        file_type: {type: string}
    SecuritySettings:
      type: object
      required: [username, session_lifetime_days]
      properties:
        username: { type: string }
        session_lifetime_days: { type: integer, enum: [1, 7, 30] }
    SecurityCredentialsRequest:
      type: object
      additionalProperties: false
      required: [username, current_password, new_password]
      properties:
        username: { type: string }
        current_password: { type: string }
        new_password:
          { type: string, description: Empty preserves the existing password. }
    SecuritySessionRequest:
      type: object
      additionalProperties: false
      required: [session_lifetime_days]
      properties:
        session_lifetime_days: { type: integer, enum: [1, 7, 30] }
    Provider115Account:
      type: object
      required: [connected, account_name, connected_at]
      properties:
        connected: { type: boolean }
        account_name: { type: string, nullable: true }
        connected_at: { type: string, format: date-time, nullable: true }
    Provider115Details:
      type: object
      required: [status, profile, space, space_status, devices, devices_status]
      properties:
        status: { type: string, enum: [unconfigured, valid, invalid] }
        profile:
          allOf:
            - $ref: "#/components/schemas/Provider115Profile"
          nullable: true
        space:
          allOf:
            - $ref: "#/components/schemas/Provider115Space"
          nullable: true
        space_status: { type: string, enum: [available, unavailable] }
        devices:
          type: array
          items: { $ref: "#/components/schemas/Provider115Device" }
        devices_status: { type: string, enum: [available, unavailable] }
    Provider115Profile:
      type: object
      required:
        [
          user_name,
          user_id,
          avatar,
          is_member,
          member_expires_at,
          member_forever,
        ]
      properties:
        user_name: { type: string }
        user_id:
          {
            type: string,
            nullable: true,
            description: Provider user ID represented as a string.,
          }
        avatar: { type: string, nullable: true }
        is_member:
          {
            type: boolean,
            nullable: true,
            description: Known Cookie nav VIP values mapped to membership only; unknown values remain null.,
          }
        member_expires_at:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: Membership expiry; null when unknown or no expiry is provided.,
          }
        member_forever:
          {
            type: boolean,
            nullable: true,
            description: Whether the provider marks membership as permanent.,
          }
    Provider115Space:
      type: object
      required: [used_bytes, total_bytes]
      properties:
        used_bytes:
          {
            type: string,
            description: Decimal byte count truncated towards zero.,
          }
        total_bytes:
          {
            type: string,
            description: Decimal byte count truncated towards zero.,
          }
    Provider115Device:
      type: object
      required: [name, type, ip, city, login_at, is_current]
      properties:
        name: { type: string }
        type: { type: string }
        ip: { type: string }
        city: { type: string }
        login_at: { type: string, format: date-time, nullable: true }
        is_current: { type: boolean }
    Provider115QR:
      type: object
      required: [id, qr_url, status, expires_at]
      properties:
        id: { type: string }
        qr_url: { type: string, description: PNG data URI }
        status:
          {
            type: string,
            enum: [waiting, scanned, succeeded, expired, canceled],
          }
        expires_at: { type: string, format: date-time }

    Administrator:
      type: object
      additionalProperties: false
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string
    AuthSession:
      type: object
      additionalProperties: false
      required: [administrator, expires_at, csrf_token]
      properties:
        administrator:
          $ref: "#/components/schemas/Administrator"
        expires_at:
          type: string
          format: date-time
        csrf_token:
          type: string
    AuthBootstrap:
      type: object
      additionalProperties: false
      required:
        [initialized, authenticated, administrator, expires_at, csrf_token]
      properties:
        initialized:
          type: boolean
        authenticated:
          type: boolean
        administrator:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Administrator"
        expires_at:
          type: string
          format: date-time
          nullable: true
        csrf_token:
          type: string
    InitializeRequest:
      type: object
      additionalProperties: false
      required:
        [
          username,
          password,
          service_url,
          output_directory,
          session_lifetime_days,
        ]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9_.-]+$"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 32
          pattern: '^[!-~]{8,32}(?![\s\S])'
          description: 8–32 printable non-space ASCII characters (U+0021–U+007E); letters, digits and ASCII symbols; no required mixture
        service_url:
          type: string
          description: Absolute HTTP(S) origin without credentials, query, fragment or path prefix
        output_directory:
          type: string
          default: /app/media
          description: Normalized absolute server filesystem path; syntax validation does not guarantee write access
        session_lifetime_days:
          type: integer
          enum: [1, 7, 30]
          default: 7
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password, remember_login]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9_.-]+$"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 32
          pattern: '^[!-~]{8,32}(?![\s\S])'
          description: 8–32 printable non-space ASCII characters (U+0021–U+007E); letters, digits and ASCII symbols; no required mixture
        remember_login:
          type: boolean
    SystemStatus:
      type: object
      additionalProperties: false
      required: [uptime_seconds, version]
      properties:
        uptime_seconds:
          type: integer
          format: int64
          minimum: 0
        version:
          type: string
          minLength: 1
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/APIError"
    APIError:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          enum:
            [
              provider_not_configured,
              provider_auth_invalid,
              service_unavailable,
              not_found,
              method_not_allowed,
              internal_error,
              conflict,
              validation_failed,
              invalid_credentials,
              authentication_required,
              csrf_invalid,
              setup_required,
              already_initialized,
              rate_limited,
            ]
        message:
          type: string
        request_id:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
          description: Optional safe field validation messages keyed by request property name

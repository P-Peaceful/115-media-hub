openapi: 3.0.3
info:
  title: 115 Media Hub API
  version: 0.1.0
paths:
  /api/v1/task-types:
    get:
      operationId: listTaskTypes
      security: [{adminSession: []}]
      responses:
        "200":
          description: Successful task center response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskTypeCapabilities"}
        "401": {$ref: "#/components/responses/TaskCenterAuthenticationRequired"}
        "503": {$ref: "#/components/responses/TaskCenterUnavailable"}
  /api/v1/tasks:
    get:
      operationId: listTasks
      security: [{adminSession: []}]
      description: Newest first. The type counts ignore the type filter and the status counts ignore the status filter.
      parameters:
        - {name: type, in: query, schema: {$ref: "#/components/schemas/TaskType"}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/TaskStatus"}}
        - {name: library_id, in: query, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 256}}
      responses:
        "200":
          description: Successful task center response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskPage"}
        "400": {$ref: "#/components/responses/TaskCenterValidationError"}
        "401": {$ref: "#/components/responses/TaskCenterAuthenticationRequired"}
        "503": {$ref: "#/components/responses/TaskCenterUnavailable"}
    post:
      operationId: submitTask
      security: [{adminSession: []}]
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubmitTaskInput"}
      responses:
        "202":
          description: Successful task center response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "400": {$ref: "#/components/responses/TaskCenterValidationError"}
        "401": {$ref: "#/components/responses/TaskCenterAuthenticationRequired"}
        "403": {$ref: "#/components/responses/TaskCenterCSRFError"}
        "404": {$ref: "#/components/responses/TaskCenterNotFound"}
        "409": {$ref: "#/components/responses/TaskCenterConflict"}
        "503": {$ref: "#/components/responses/TaskCenterUnavailable"}
  /api/v1/tasks/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    get:
      operationId: getTask
      security: [{adminSession: []}]
      responses:
        "200":
          description: Successful task center response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "400": {$ref: "#/components/responses/TaskCenterValidationError"}
        "401": {$ref: "#/components/responses/TaskCenterAuthenticationRequired"}
        "404": {$ref: "#/components/responses/TaskCenterNotFound"}
        "503": {$ref: "#/components/responses/TaskCenterUnavailable"}
  /api/v1/tasks/{id}/failures:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    get:
      operationId: listTaskFailures
      security: [{adminSession: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 256}}
      responses:
        "200":
          description: Successful task center response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskFailurePage"}
        "400": {$ref: "#/components/responses/TaskCenterValidationError"}
        "401": {$ref: "#/components/responses/TaskCenterAuthenticationRequired"}
        "404": {$ref: "#/components/responses/TaskCenterNotFound"}
        "503": {$ref: "#/components/responses/TaskCenterUnavailable"}
  /api/v1/tasks/{id}/logs:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    get:
      operationId: listTaskLogs
      security: [{adminSession: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 256}}
      responses:
        "200":
          description: Successful task center response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskLogPage"}
        "400": {$ref: "#/components/responses/TaskCenterValidationError"}
        "401": {$ref: "#/components/responses/TaskCenterAuthenticationRequired"}
        "404": {$ref: "#/components/responses/TaskCenterNotFound"}
        "503": {$ref: "#/components/responses/TaskCenterUnavailable"}
  /api/v1/tasks/{id}/actions:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    post:
      operationId: applyTaskAction
      security: [{adminSession: []}]
      description: Retry returns the newly queued task. Other actions return the updated original task.
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaskActionInput"}
      responses:
        "202":
          description: Successful task center response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "400": {$ref: "#/components/responses/TaskCenterValidationError"}
        "401": {$ref: "#/components/responses/TaskCenterAuthenticationRequired"}
        "403": {$ref: "#/components/responses/TaskCenterCSRFError"}
        "404": {$ref: "#/components/responses/TaskCenterNotFound"}
        "409": {$ref: "#/components/responses/TaskCenterConflict"}
        "503": {$ref: "#/components/responses/TaskCenterUnavailable"}
  /api/v1/schedules:
    get:
      operationId: listSchedules
      security: [{adminSession: []}]
      parameters:
        - {name: type, in: query, schema: {$ref: "#/components/schemas/TaskType"}}
        - {name: library_id, in: query, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: enabled, in: query, schema: {type: boolean}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 256}}
      responses:
        "200":
          description: Successful task center response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SchedulePage"}
        "400": {$ref: "#/components/responses/TaskCenterValidationError"}
        "401": {$ref: "#/components/responses/TaskCenterAuthenticationRequired"}
        "503": {$ref: "#/components/responses/TaskCenterUnavailable"}
    post:
      operationId: createSchedule
      security: [{adminSession: []}]
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScheduleInput"}
      responses:
        "201":
          description: Successful task center response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Schedule"}
        "400": {$ref: "#/components/responses/TaskCenterValidationError"}
        "401": {$ref: "#/components/responses/TaskCenterAuthenticationRequired"}
        "403": {$ref: "#/components/responses/TaskCenterCSRFError"}
        "404": {$ref: "#/components/responses/TaskCenterNotFound"}
        "409": {$ref: "#/components/responses/TaskCenterConflict"}
        "503": {$ref: "#/components/responses/TaskCenterUnavailable"}
  /api/v1/schedules/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    get:
      operationId: getSchedule
      security: [{adminSession: []}]
      responses:
        "200":
          description: Successful task center response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Schedule"}
        "400": {$ref: "#/components/responses/TaskCenterValidationError"}
        "401": {$ref: "#/components/responses/TaskCenterAuthenticationRequired"}
        "404": {$ref: "#/components/responses/TaskCenterNotFound"}
        "503": {$ref: "#/components/responses/TaskCenterUnavailable"}
    put:
      operationId: updateSchedule
      security: [{adminSession: []}]
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
        - name: X-Schedule-Revision
          in: header
          required: true
          description: Decimal revision from the schedule being edited.
          schema: {type: string, pattern: '^[1-9][0-9]*$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScheduleInput"}
      responses:
        "200":
          description: Successful task center response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Schedule"}
        "400": {$ref: "#/components/responses/TaskCenterValidationError"}
        "401": {$ref: "#/components/responses/TaskCenterAuthenticationRequired"}
        "403": {$ref: "#/components/responses/TaskCenterCSRFError"}
        "404": {$ref: "#/components/responses/TaskCenterNotFound"}
        "409": {$ref: "#/components/responses/TaskCenterConflict"}
        "503": {$ref: "#/components/responses/TaskCenterUnavailable"}
    delete:
      operationId: deleteSchedule
      security: [{adminSession: []}]
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "204":
          description: Schedule deleted
        "400": {$ref: "#/components/responses/TaskCenterValidationError"}
        "401": {$ref: "#/components/responses/TaskCenterAuthenticationRequired"}
        "403": {$ref: "#/components/responses/TaskCenterCSRFError"}
        "404": {$ref: "#/components/responses/TaskCenterNotFound"}
        "409": {$ref: "#/components/responses/TaskCenterConflict"}
        "503": {$ref: "#/components/responses/TaskCenterUnavailable"}
  /api/v1/schedules/{id}/enabled:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    patch:
      operationId: setScheduleEnabled
      security: [{adminSession: []}]
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScheduleEnabledInput"}
      responses:
        "200":
          description: Successful task center response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Schedule"}
        "400": {$ref: "#/components/responses/TaskCenterValidationError"}
        "401": {$ref: "#/components/responses/TaskCenterAuthenticationRequired"}
        "403": {$ref: "#/components/responses/TaskCenterCSRFError"}
        "404": {$ref: "#/components/responses/TaskCenterNotFound"}
        "409": {$ref: "#/components/responses/TaskCenterConflict"}
        "503": {$ref: "#/components/responses/TaskCenterUnavailable"}
  /api/v1/events:
    get:
      operationId: streamTaskEvents
      security: [{adminSession: []}]
      description: Named task.changed and schedule.changed events carry TaskEvent JSON. IDs are scoped to the connection. Reconnect by refetching current data.
      responses:
        "200":
          description: Authenticated live event stream
          content:
            text/event-stream:
              schema: {type: string}
        "401": {$ref: "#/components/responses/TaskCenterAuthenticationRequired"}
        "503": {$ref: "#/components/responses/TaskCenterUnavailable"}
  /api/v1/libraries:
    get:
      operationId: listLibraries
      summary: List library configurations ordered by ID
      security: [{adminSession: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200":
          description: Library page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LibraryPage"}
        "400": {$ref: "#/components/responses/AuthError"}
        "401": {$ref: "#/components/responses/AuthError"}
        "503": {$ref: "#/components/responses/Unavailable"}
    post:
      operationId: createLibrary
      summary: Create a library configuration
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LibraryConfig"}
      responses:
        "201": {$ref: "#/components/responses/LibraryResult"}
        "400": {$ref: "#/components/responses/AuthError"}
        "401": {$ref: "#/components/responses/AuthError"}
        "403": {$ref: "#/components/responses/AuthError"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/libraries/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getLibrary
      security: [{adminSession: []}]
      responses:
        "200": {$ref: "#/components/responses/LibraryResult"}
        "401": {$ref: "#/components/responses/AuthError"}
        "404": {$ref: "#/components/responses/AuthError"}
        "503": {$ref: "#/components/responses/Unavailable"}
    put:
      operationId: updateLibrary
      description: Supply the revision read with the edited configuration. A stale revision returns 409.
      security: [{adminSession: []}]
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
        - name: X-Library-Revision
          in: header
          required: true
          description: Decimal revision from the library being edited.
          schema: {type: string, pattern: '^[1-9][0-9]*$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LibraryConfig"}
      responses:
        "200": {$ref: "#/components/responses/LibraryResult"}
        "400": {$ref: "#/components/responses/AuthError"}
        "401": {$ref: "#/components/responses/AuthError"}
        "403": {$ref: "#/components/responses/AuthError"}
        "404": {$ref: "#/components/responses/AuthError"}
        "409": {$ref: "#/components/responses/AuthError"}
        "503": {$ref: "#/components/responses/Unavailable"}
    delete:
      operationId: deleteLibrary
      summary: Delete configuration only; never delete files
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/AuthError"}
        "403": {$ref: "#/components/responses/AuthError"}
        "404": {$ref: "#/components/responses/AuthError"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/libraries/{id}/enabled:
    patch:
      operationId: setLibraryEnabled
      security: [{adminSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        "200": {$ref: "#/components/responses/LibraryResult"}
        "400": {$ref: "#/components/responses/AuthError"}
        "401": {$ref: "#/components/responses/AuthError"}
        "403": {$ref: "#/components/responses/AuthError"}
        "404": {$ref: "#/components/responses/AuthError"}
        "409": {$ref: "#/components/responses/AuthError"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/libraries/{id}/full-sync-preview:
    get:
      operationId: previewLibraryFullSync
      summary: Scan the saved 115 source and inspect the configured STRM output directory
      description: Read-only. Samples are bounded. When the preview deadline expires, counts include only the portion already scanned. Confirmation scans again with the current saved configuration.
      security: [{adminSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        "200":
          description: Source scan and local output readiness
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FullSyncPreview"}
        "400": {$ref: "#/components/responses/AuthError"}
        "401": {$ref: "#/components/responses/AuthError"}
        "404": {$ref: "#/components/responses/AuthError"}
        "409": {$ref: "#/components/responses/AuthError"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504":
          description: Preview scan deadline exceeded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
  /api/v1/strm:
    get:
      operationId: listStrmFiles
      summary: List registered STRM artifacts and count the same filtered result
      security: [{adminSession: []}]
      parameters:
        - {name: library_id, in: query, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: q, in: query, schema: {type: string, maxLength: 256}}
        - {name: sort, in: query, schema: {type: string, enum: [name, generated], default: generated}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Registered STRM page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StrmPage"}
        "400": {$ref: "#/components/responses/AuthError"}
        "401": {$ref: "#/components/responses/AuthError"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/strm/{id}:
    get:
      operationId: getStrmFile
      summary: Read a registered STRM artifact and inspect current file contents
      security: [{adminSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: STRM file details
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StrmDetail"}
        "401": {$ref: "#/components/responses/AuthError"}
        "404": {$ref: "#/components/responses/AuthError"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /p/{id}/{token}/{name}:
    get:
      operationId: redirectStrmPlayback
      summary: Resolve a registered STRM to a fresh 115 playback link
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: token, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        "302":
          description: Temporary 115 media URL
          headers:
            Location: {required: true, schema: {type: string, format: uri}}
        "404": {$ref: "#/components/responses/AuthError"}
        "409": {$ref: "#/components/responses/AuthError"}
        "503": {$ref: "#/components/responses/Unavailable"}
    head:
      operationId: redirectStrmPlaybackHead
      summary: Resolve a playback probe
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: token, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        "302":
          description: Temporary 115 media URL
          headers:
            Location: {required: true, schema: {type: string, format: uri}}
        "404": {$ref: "#/components/responses/AuthError"}
        "409": {$ref: "#/components/responses/AuthError"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /health/live:
    get:
      operationId: getLiveness
      summary: Check that the HTTP process is alive
      responses:
        "200":
          $ref: "#/components/responses/Healthy"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check database readiness
      responses:
        "200":
          $ref: "#/components/responses/Healthy"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      summary: Get running process information
      description: Requires an administrator session. Uptime is elapsed process lifetime in whole seconds; version is the build version or dev for unversioned builds. No-store response.
      security:
        - adminSession: []
      responses:
        "200":
          description: Process information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          $ref: "#/components/responses/AuthError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/auth/bootstrap:
    get:
      operationId: getAuthBootstrap
      summary: Obtain authentication state and an in-memory CSRF token
      description: Establishes a short-lived HttpOnly pre-auth cookie if unauthenticated. All responses use Cache-Control no-store. No anonymous identity or settings are exposed.
      responses:
        "200":
          description: Authentication state; authenticated session cookie is never returned in JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthBootstrap"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/auth/initialize:
    post:
      operationId: initializeAdministrator
      summary: Atomically initialize one administrator and settings and start a session
      description: Requires bootstrap cookie plus X-CSRF-Token. Maximum JSON body 4096 bytes. Sets a persistent HttpOnly SameSite=Lax session cookie; Secure on configured HTTPS deployments or direct TLS. Rotates any previous session. No-store responses.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializeRequest"
      responses:
        "201":
          $ref: "#/components/responses/SessionStarted"
        "400":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "409":
          $ref: "#/components/responses/AuthError"
        "429":
          $ref: "#/components/responses/Throttled"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/auth/login:
    post:
      operationId: loginAdministrator
      summary: Verify credentials and rotate the authenticated session
      description: Requires bootstrap cookie plus X-CSRF-Token. Maximum JSON body 4096 bytes. Remember-login sets cookie Max-Age and Expires; false omits both. Server fixed expiry always applies. No-store responses.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SessionStarted"
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "409":
          $ref: "#/components/responses/AuthError"
        "429":
          $ref: "#/components/responses/Throttled"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/auth/logout:
    post:
      operationId: logoutAdministrator
      summary: Revoke the current session and expire its cookie
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Session revoked; cookie expired; no-store response
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/settings/security:
    get:
      operationId: getSecuritySettings
      summary: getSecuritySettings
      security:
        - adminSession: []
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySettings"
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "404":
          $ref: "#/components/responses/AuthError"
        "503":
          $ref: "#/components/responses/AuthError"
  /api/v1/settings/security/credentials:
    put:
      operationId: updateSecurityCredentials
      summary: updateSecurityCredentials
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityCredentialsRequest"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySettings"
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "404":
          $ref: "#/components/responses/AuthError"
        "503":
          $ref: "#/components/responses/AuthError"
  /api/v1/settings/security/session:
    put:
      operationId: updateSecuritySession
      summary: updateSecuritySession
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecuritySessionRequest"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySettings"
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "404":
          $ref: "#/components/responses/AuthError"
        "503":
          $ref: "#/components/responses/AuthError"
  /api/v1/cloud-drive/files:
    get:
      operationId: listCloudDriveFiles
      summary: Browse a 115 directory
      description: Read-only provider listing. Offset-based pages may shift if the directory changes; refresh to restart. Search is not supported.
      security:
        - adminSession: []
      parameters:
        - name: directory_id
          in: query
          schema: {type: string, default: "0", pattern: '^[0-9]{1,32}$'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: cursor
          in: query
          description: Legacy opaque cursor; mutually exclusive with page.
          schema: {type: string, maxLength: 512}
        - name: page
          in: query
          description: One-based page; mutually exclusive with cursor. Page offset must not exceed JavaScript safe integer range.
          schema: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
        - name: sort
          in: query
          schema: {type: string, enum: [name, size, modified_at], default: name}
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc], default: asc}
        - name: type
          in: query
          schema: {type: string, enum: [all, video, audio, image, document], default: all}
      responses:
        "200":
          description: Directory page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CloudDrivePage"}
        "400": {$ref: "#/components/responses/AuthError"}
        "401": {$ref: "#/components/responses/AuthError"}
        "404": {$ref: "#/components/responses/AuthError"}
        "409": {$ref: "#/components/responses/AuthError"}
        "503": {$ref: "#/components/responses/AuthError"}

name: 115-media-hub
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: 115-media-hub:local
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      TZ: Asia/Shanghai
      MEDIA_HUB_HTTP_ADDR: 0.0.0.0:8080
      MEDIA_HUB_DATABASE_PATH: /data/115-media-hub.db
      MEDIA_HUB_LOG_DIR: /logs
      MEDIA_HUB_SHUTDOWN_TIMEOUT: 10s
      MEDIA_HUB_ADMIN_USERNAME: ${MEDIA_HUB_ADMIN_USERNAME:?Set MEDIA_HUB_ADMIN_USERNAME in .env}
      MEDIA_HUB_ADMIN_PASSWORD: ${MEDIA_HUB_ADMIN_PASSWORD:?Set MEDIA_HUB_ADMIN_PASSWORD in .env}
      MEDIA_HUB_COOKIE_SECURE: ${MEDIA_HUB_COOKIE_SECURE:-false}
    volumes:
      - data:/data
      - strm:/storage/strm
      - quarantine:/storage/quarantine
      - cache:/cache
      - logs:/logs
      - backups:/backups
    stop_grace_period: 15s
volumes:
  data:
  strm:
  quarantine:
  cache:
  logs:
  backups:
